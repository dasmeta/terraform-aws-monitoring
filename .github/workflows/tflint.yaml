name: Tflint
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  terraform-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - modules/alerts
          - modules/security-hub
          - modules/billing
          - modules/cloudwatch-alarm-actions
          - modules/dashboard
          - modules/eventbridge
          - modules/sns_to_lambda
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v6.3.1
        with:
          tflint_version: v0.64.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run TFLint
        working-directory: ${{ matrix.path }}
        run: |
          tflint --init
          tflint --force --enable-rule=terraform_unused_declarations
