name: Checkov
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  terraform-validate:
    # The reusable Checkov action installs Python 3.14.3, which has no Ubuntu 26.04 build.
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      discussions: write
      pull-requests: write
      security-events: write
      id-token: write
    strategy:
      matrix:
        path:
          - ./
          - modules/alerts
          - modules/security-hub
          - modules/billing
          - modules/cloudwatch-alarm-actions
          - modules/dashboard
          - modules/eventbridge
          - modules/sns_to_lambda
    steps:
    - uses: dasmeta/reusable-actions-workflows/checkov@4.4.0
      with:
        fetch-depth: 0
        directory: ${{ matrix.path }}
