name: Terraform Test
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  terraform-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - modules/alerts
          - modules/security-hub
          - modules/billing
          - modules/cloudwatch-alarm-actions
          - modules/cloudwatch-synthetics
          - modules/dashboard
          - modules/eventbridge
          - modules/sns_to_lambda
    steps:
      - uses: actions/checkout@v4
      - name: Verify CloudWatch Synthetics public boundary
        if: matrix.path == 'modules/cloudwatch-synthetics'
        run: bash modules/cloudwatch-synthetics/tests/basic/3-static-assert.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Initialize Terraform
        working-directory: ${{ matrix.path }}
        run: terraform init -backend=false -input=false
      - name: Run Terraform tests
        working-directory: ${{ matrix.path }}
        run: terraform test
